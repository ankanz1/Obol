<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice RAG - MSMARCO-XI</title>
    <link rel="icon" href="data:;base64,=">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; line-height: 1.6; }
        #root { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
        .app { display: flex; flex-direction: column; min-height: 100vh; }
        .header { padding: 1rem 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 1rem; text-align: center; }
        .header h1 { font-size: 1.5rem; font-weight: 600; color: #0f172a; margin-bottom: 0.25rem; }
        .subtitle { color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-bar { display: flex; justify-content: center; align-items: center; gap: 0.75rem; margin-top: 0.5rem; flex-wrap: wrap; justify-content: center; }
        .conn-status { font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 9999px; font-weight: 500; }
        .conn-status.connected { background: #dcfce7; color: #166534; }
        .conn-status.disconnected { background: #fee2e2; color: #991b1b; }
        .main { flex: 1; display: flex; flex-direction: column; gap: 1rem; }
        .chat-panel { flex: 1; background: white; border-radius: 0.5rem; border: 1px solid #e2e8f0; overflow: hidden; }
        .message-list { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { display: flex; flex-direction: column; gap: 0.5rem; max-width: 85%; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.assistant { align-self: flex-start; align-items: flex-start; }
        .message-header { display: flex; align-items: center; gap: 0.5rem; font-size: 0.625rem; color: #64748b; }
        .message.user .message-header { flex-direction: row-reverse; }
        .message-role { font-weight: 600; text-transform: capitalize; }
        .message-language { background: #e2e8f0; padding: 0.125rem 0.375rem; border-radius: 9999x; font-family: monospace; font-size: 0.65rem; }
        .message-latency { background: #fef3c7; color: #92400e; padding: 0.125rem 0.375rem; border-radius: 9999x; font-family: monospace; font-size: 0.65rem; }
        .message-content { background: #f1f5f9; padding: 0.75rem 1rem; border-radius: 0.5rem; border-bottom-left-radius: 0.25rem; }
        .message.user .message-content { background: #3b82f6; color: white; border-radius: 1rem; border-bottom-right-radius: 0.25rem; }
        .audio-player { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; padding: 0.5rem; background: rgba(0,0,0,0.05); border-radius: 0.5rem; }
        .message.user .audio-player { background: rgba(255,255,255,0.2); }
        .recorder-panel { background: white; border-radius: 0.5rem; border: 1px solid #e2e8f0; padding: 1.5rem; }
        .voice-recorder { width: 100%; }
        .recorder-header { display: flex; align-items: center; justify-content: center; gap: 1rem; width: 100%; margin-bottom: 1rem; }
        .language-badge { background: #3b82f6; color: white; padding: 0.25rem 0.75rem; border-radius: 9999x; font-size: 0.75rem; font-weight: 600; }
        .status-badge { font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 9999x; font-weight: 500; }
        .status-badge.recording { background: #ef4444; color: #fff; animation: pulse 1.5s infinite; }
        .status-badge.processing { background: #fef3c7; color: #92400e; }
        .status-badge.idle { background: #e2e8f0; color: #64748b; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .waveform-canvas { width: 100%; max-width: 400px; border-radius: 0.5rem; background: #f8fafc; }
        .recorder-controls { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; width: 100%; }
        .record-btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem 2rem; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; background: #3b82f6; color: white; min-width: 200px; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); }
        .record-btn:hover:not(.disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
        .record-btn:active:not(.disabled) { transform: translateY(0); }
        .record-btn.recording { background: #ef4444; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3); animation: pulse 1.5s infinite; }
        .record-btn.disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-icon { font-size: 1.25rem; }
        .btn-text { font-size: 1rem; }
        .hint { font-size: 0.625rem; opacity: 0.8; margin-left: 0.25rem; }
        .recording-timer { display: flex; align-items: center; gap: 0.5rem; color: #ef4444; font-size: 0.875rem; font-weight: 500; }
        .pulse { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .processing-indicator { display: flex; align-items: center; gap: 0.5rem; color: #64748b; font-size: 0.875rem; }
        .spinner { width: 16px; height: 16px; border: 2 solid #fbbf24; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .recorder-help { font-size: 0.75rem; color: #64748b; text-align: center; margin-top: 1rem; }
        .recorder-help kbd { background: #e2e8f0; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-family: monospace; margin: 0 0.25rem; }
        .error-toast { display: flex; align-items: center; justify-content: space-between; background: #fee2e2; color: #991b1b; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-top: 1rem; font-size: 0.875rem; border: 1px solid rgba(239,68,68,0.2); }
        .error-toast button { background: none; border: none; color: inherit; cursor: pointer; font-size: 1rem; padding: 0.25rem; opacity: 0.7; transition: opacity 0.2s; }
        .error-toast button:hover { opacity: 1; }
        .app-footer { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-top: 1px solid #e2e8f0; margin-top: 1rem; flex-wrap: wrap; gap: 1rem; }
        .app-footer button { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.875rem; color: #475569; cursor: pointer; transition: all 0.2s; }
        .app-footer button:hover:not(:disabled) { background: #e2e8f0; color: #1e293b; }
        .app-footer button:disabled { opacity: 0.5; cursor: not-allowed; }
        .languages-info { font-size: 0.625rem; color: #64748b; max-width: 600px; text-align: right; }
        @media (max-width: 600px) { .app { padding: 0.5rem; } .message { max-width: 95%; } .status-bar { flex-direction: column; gap: 0.5rem; } .languages-info { text-align: center; margin-top: 0.5rem; } .record-btn { min-width: 180px; padding: 0.75rem 1rem; font-size: 0.875rem; } }
    </style>
</head>
<body>
    <div id="root" class="app"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
